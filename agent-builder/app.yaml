# Databricks App definition for Agent Brick Builder.
#
# Serves the FastAPI backend (agent-builder/server) which, in turn, mounts the
# built React client (agent-builder/client/dist) at /. UI and API are one
# origin, so there is no CORS in the deployed App.
#
# Before deploying, build the client so client/dist exists:
#   ./scripts/build.sh        (or: cd client && npm ci && npm run build)
# See docs/deploy-app.md.
#
# The Databricks Apps runtime installs requirements.txt (app root) and injects
# the port to bind via DATABRICKS_APP_PORT; server/app.py honors it.

command: ["python", "server/app.py"]

env:
  # Registry storage. Defaults to a writable temp dir (see server/store.py).
  # TODO: point at a mounted UC volume for durability across restarts, e.g.
  #   value: "/Volumes/<catalog>/<schema>/<volume>/agent-builder/registry.json"
  - name: AGENT_REGISTRY_PATH
    value: "/tmp/agent-builder/registry.json"
